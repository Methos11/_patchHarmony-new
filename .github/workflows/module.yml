name: Build Custom LKM (Hardcore)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Override config and symvers
        run: |
          # 强制使用你上传的原厂文件
          cp config .config
          cp Module.symvers ./
          echo "--- 已注入原厂 config 和 symvers ---"
          ls -lh .config Module.symvers

      - name: Build Custom Module (Force Use Local Symvers)
        run: |
          # 关键：通过 KBUILD_EXTRA_SYMBOLS 变量强制 make 使用本地的符号表
          make VER=android13-5.15 \
               KERNEL_SRC=$(pwd) \
               KDIR=$(pwd) \
               KBUILD_EXTRA_SYMBOLS=$(pwd)/Module.symvers \
               > build.log 2>&1 || { tail -100 build.log; exit 1; }
          tail -10 build.log

      - name: Patch Vermagic
        run: |
          python3 -c "
          import os
          for file in ['out/android13-5.15/droid_lkm.ko', 'out/android13-5.15/droid_lkm_vendor.ko']:
              if os.path.exists(file):
                  with open(file, 'rb') as f: data = f.read()
                  old = b'5.15.202-android13-5.15.202_r00-dirty'
                  new = b'5.15.180-android13-8-o-g88bbcb96ee5e'
                  if old in data:
                      data = data.replace(old, new.ljust(len(old), b'\0'))
                      with open(file, 'wb') as f: f.write(data)
                      print(f'✅ 强制修改 Vermagic 成功: {file}')
                  else:
                      print(f'⚠️ 未找到 Vermagic 字符串，可能原厂编译已经匹配')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: droid_lkm-OPPO-RealCustom
          path: |
            out/android13-5.15/droid_lkm.ko
            out/android13-5.15/droid_lkm_vendor.ko
          if-no-files-found: error
