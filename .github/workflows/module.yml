name: Build Custom LKM (Hardcore)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch deps (Use HTTPS)
        run: |
          chmod +x scripts/fetch-deps.sh
          scripts/fetch-deps.sh

      - name: Override config and symvers
        run: |
          cp config .config
          echo "--- 检查原厂文件 ---"
          ls -lh .config Module.symvers

      - name: Build Custom Module
        run: |
          # 让 make 自己寻找正确的内核源码树，我们只负责把符号表塞给它
          KBUILD_EXTRA_SYMBOLS=$(pwd)/Module.symvers make VER=android13-5.15 > build.log 2>&1 || { tail -100 build.log; exit 1; }
          tail -10 build.log

      - name: Patch Vermagic
        run: |
          python3 -c "
          import os
          for file in ['out/android13-5.15/droid_lkm.ko', 'out/android13-5.15/droid_lkm_vendor.ko']:
              if os.path.exists(file):
                  with open(file, 'rb') as f: data = f.read()
                  old = b'5.15.202-android13-5.15.202_r00-dirty'
                  new = b'5.15.180-android13-8-o-g88bbcb96ee5e'
                  if old in data:
                      data = data.replace(old, new.ljust(len(old), b'\0'))
                      with open(file, 'wb') as f: f.write(data)
                      print(f'✅ 强制修改 Vermagic 成功: {file}')
                  else:
                      print(f'⚠️ 未找到 Vermagic 字符串')
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: droid_lkm-OPPO-RealCustom
          path: |
            out/android13-5.15/droid_lkm.ko
            out/android13-5.15/droid_lkm_vendor.ko
          if-no-files-found: error
